name: SRTPV data bot

on:
  schedule:
    - cron: "15 */3 * * *"      # every 3 hours at :15 (UTC); GitHub may start it a few minutes late
  workflow_dispatch:             # "Run workflow" button for testing

concurrency:
  group: data-bot                # never run two bots at once
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BOT_IMAP_HOST: ${{ secrets.BOT_IMAP_HOST }}
      BOT_SMTP_HOST: ${{ secrets.BOT_SMTP_HOST }}
      BOT_EMAIL: ${{ secrets.BOT_EMAIL }}
      BOT_PASSWORD: ${{ secrets.BOT_PASSWORD }}
      ALLOWED_SENDERS: ${{ secrets.ALLOWED_SENDERS }}
      BOT_NOTIFY: ${{ secrets.BOT_NOTIFY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bot/requirements-bot.txt
      - run: pip install -r bot/requirements-bot.txt
      - name: Import emailed sheets
        run: python -m bot.email_bot
      - name: Fill missing weather
        run: python -m bot.weather
